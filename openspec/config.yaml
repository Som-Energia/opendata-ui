schema: spec-driven

context: |
  React 17 SPA with react-scripts 5, Node 22.
  Material-UI v4 + Emotion styling.
  JS (no TypeScript). i18next for localization.
  Jest via react-scripts; @testing-library/react.
  Standard JS + Prettier config.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (functional components, hooks)
    tdd: true
    test_command: "npm test -- --watchAll=false"
  verify:
    test_command: "npm test -- --watchAll=false"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  detected: 2026-07-30
  runner:
    command: "npm test"
    framework: "Jest (via react-scripts)"
  layers:
    unit:
      available: true
      tool: "@testing-library/react + Jest"
    integration:
      available: false
      tool: "—"
    e2e:
      available: false
      tool: "—"
  coverage:
    available: true
    command: "npm test -- --coverage --watchAll=false"
  quality:
    linter:
      available: true
      command: "npx standard"
    type_checker:
      available: false
      command: "—"
    formatter:
      available: true
      command: "npx standard --fix"
